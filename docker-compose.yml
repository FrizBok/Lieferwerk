services:
  lieferwerk:
    build: .
    container_name: lieferwerk
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TZ: Europe/Berlin
      # Optional: legt beim ersten Start automatisch den Benutzer "admin" an.
      # Ohne Angabe richtest du den ersten Benutzer im Browser ein.
      # ADMIN_PASSWORD: "bitte-aendern"
      # Auf "1" setzen, wenn die App hinter HTTPS (Reverse Proxy) laeuft:
      # COOKIE_SECURE: "1"
    volumes:
      - lieferwerk-data:/data

volumes:
  lieferwerk-data:
